[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-pipeline"
version = "0.1.0"
description = "EtLT pipeline for NYC Green Taxi data: Polars, DuckDB, dbt, Prefect"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "click",
    "pyyaml",
    "pandas",
    "pyarrow",
    "polars",
    "duckdb",
    "dbt-duckdb",
    "prefect",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]

[project.scripts]
taxi-download = "taxi_pipeline.download_files:main"
taxi-clean    = "taxi_pipeline.clean_green_taxi:main"
taxi-run      = "taxi_pipeline.pipeline_flow:main"
#taxi-serve    = "taxi_pipeline.serve:main"

[tool.setuptools.packages.find]
where = ["src"]